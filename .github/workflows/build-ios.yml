name: Build Trustify iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Trustify IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Package iOS Application
        run: |
          xcodebuild build \
            -project Trustify.xcodeproj \
            -scheme Trustify \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Create standard IPA packaging
          mkdir -p ipa_output/Payload
          cp -r "build/Build/Products/Release-iphoneos/Trustify.app" ipa_output/Payload/
          cd ipa_output
          zip -r -9 Trustify.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trustify-iOS-IPA
          path: ipa_output/Trustify.ipa
          retention-days: 14
