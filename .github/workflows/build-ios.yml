name: Build Trustify iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Trustify IPA with xtool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect xtool
        run: |
          wget https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool-x86_64.AppImage -O xtool
          chmod +x xtool
          ./xtool sdk install --help || true
          ./xtool dev --help || true
