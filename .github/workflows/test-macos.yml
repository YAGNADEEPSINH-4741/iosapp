name: Test macOS Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test_macos13:
    name: Test macos-13
    runs-on: macos-13
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: echo "macos-13 works!"

  test_macos_latest:
    name: Test macos-latest
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: echo "macos-latest works!"
